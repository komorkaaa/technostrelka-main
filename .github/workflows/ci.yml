name: CI

on:
  push:
    branches:
      - '**'

jobs:
  checks:
    name: Backend + Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare env
        run: cp .env.example .env

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        run: PYTHONPATH=backend PYTHONPYCACHEPREFIX=/tmp pytest -q backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Run frontend typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  compose-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref_name == 'main' || github.ref_name == 'develop' || startsWith(github.ref_name, 'release/')
    env:
      COMPOSE_PROJECT_NAME: technostrelka-ci-${{ github.run_id }}
      DOCKER_BUILDKIT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare env
        run: cp .env.example .env

      - name: Start services
        run: |
          docker compose up --build -d
          docker compose ps

      - name: Run migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Install backend test dependencies in container
        run: docker compose exec -T --user root backend pip install --no-cache-dir pytest httpx

      - name: Run backend tests in container
        run: docker compose exec -T backend python -m pytest -q -p no:cacheprovider /app/tests

      - name: Check nginx health
        run: curl -fsSk https://127.0.0.1/health > /dev/null

      - name: Save compose logs
        if: always()
        run: docker compose logs --no-color > compose.log

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-log-${{ github.run_id }}
          path: compose.log
          if-no-files-found: ignore

      - name: Shutdown services
        if: always()
        run: docker compose down -v --remove-orphans
